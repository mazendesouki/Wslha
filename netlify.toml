[build]
  command = "echo 'Using pre-built dist — no build step needed'"
  publish = "dist"

# Skip Netlify's automatic framework (Astro) detection/build
[build.environment]
  NETLIFY_USE_YARN = "false"

# Cache control
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
