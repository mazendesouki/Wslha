# Kept low deliberately — this machine has ~8GB RAM total, shared with
# Android Studio and Windows itself. The previous -Xmx8G asked for more
# heap than physically exists, crashing the Gradle daemon's JVM natively.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cache crashes when the project (E:) and the
# Pub package cache (C:\Users\...\Pub\Cache) live on different drive letters
# — its relative-path computation assumes a shared root. Disable incremental
# compilation to avoid "this and base files have different roots".
kotlin.incremental=false
kotlin.incremental.android=false
