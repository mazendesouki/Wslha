name: Build Flutter Apps (customer / driver / merchant)

on:
  push:
    branches:
      - main
      - master
      - claude/dreamy-johnson-nuzHs
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apps.yml'
  workflow_dispatch:

jobs:
  build-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Real per-app signature instead of the shared "Android Debug" cert —
      # some OEM installers (seen on MIUI) flag debug-signed APKs as
      # "conflicts with an existing package" purely from reputation-matching
      # that widely-shared certificate. Falls back to debug signing (see
      # android/app/build.gradle.kts) if this secret isn't set yet, so the
      # build never breaks — just produces a debug-signed APK instead.
      - name: Decode release keystore
        env:
          WSLHA_KEYSTORE_BASE64: ${{ secrets.WSLHA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WSLHA_KEYSTORE_BASE64" ]; then
            echo "$WSLHA_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "WSLHA_KEYSTORE_BASE64 not set — will fall back to debug signing."
          fi

      # Diagnostic only — the SHA-1 fingerprint isn't sensitive (it's meant
      # to be registered in Google Cloud Console's API key restrictions),
      # unlike the keystore file/passwords. Needed once to add this
      # release cert's fingerprint alongside the debug one already there,
      # since the Google Maps key is Android-app-restricted per cert.
      - name: Print release keystore SHA-1 (for Google Maps API key restriction)
        env:
          WSLHA_KEYSTORE_PASSWORD: ${{ secrets.WSLHA_KEYSTORE_PASSWORD }}
          WSLHA_KEY_ALIAS: ${{ secrets.WSLHA_KEY_ALIAS }}
        run: |
          if [ -f android/app/release.keystore ]; then
            keytool -list -v -keystore android/app/release.keystore \
              -storepass "$WSLHA_KEYSTORE_PASSWORD" -alias "$WSLHA_KEY_ALIAS" \
              | grep -E "SHA1:|SHA256:"
          else
            echo "No release keystore present — skipping SHA-1 print."
          fi

      - name: Build customer APK
        env:
          WSLHA_KEYSTORE_PATH: ${{ secrets.WSLHA_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          WSLHA_KEYSTORE_PASSWORD: ${{ secrets.WSLHA_KEYSTORE_PASSWORD }}
          WSLHA_KEY_ALIAS: ${{ secrets.WSLHA_KEY_ALIAS }}
          WSLHA_KEY_PASSWORD: ${{ secrets.WSLHA_KEY_PASSWORD }}
        run: flutter build apk --release --flavor customer -t lib/main_customer.dart

      - name: Build driver APK
        env:
          WSLHA_KEYSTORE_PATH: ${{ secrets.WSLHA_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          WSLHA_KEYSTORE_PASSWORD: ${{ secrets.WSLHA_KEYSTORE_PASSWORD }}
          WSLHA_KEY_ALIAS: ${{ secrets.WSLHA_KEY_ALIAS }}
          WSLHA_KEY_PASSWORD: ${{ secrets.WSLHA_KEY_PASSWORD }}
        run: flutter build apk --release --flavor driver -t lib/main_driver.dart

      - name: Build merchant APK
        env:
          WSLHA_KEYSTORE_PATH: ${{ secrets.WSLHA_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          WSLHA_KEYSTORE_PASSWORD: ${{ secrets.WSLHA_KEYSTORE_PASSWORD }}
          WSLHA_KEY_ALIAS: ${{ secrets.WSLHA_KEY_ALIAS }}
          WSLHA_KEY_PASSWORD: ${{ secrets.WSLHA_KEY_PASSWORD }}
        run: flutter build apk --release --flavor merchant -t lib/main_merchant.dart

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: wslha-customer-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-customer-release.apk
          retention-days: 30

      - name: Upload driver APK
        uses: actions/upload-artifact@v4
        with:
          name: wslha-driver-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-driver-release.apk
          retention-days: 30

      - name: Upload merchant APK
        uses: actions/upload-artifact@v4
        with:
          name: wslha-merchant-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-merchant-release.apk
          retention-days: 30
