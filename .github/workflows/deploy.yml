name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
      - claude/dreamy-johnson-nuzHs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --project wslha-941c8 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE }}
