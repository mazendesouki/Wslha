name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
      - claude/dreamy-johnson-nuzHs
  # The "Publish APKs to website downloads" step in build-flutter-apps.yml
  # commits new public/downloads/*.apk bytes and pushes using the default
  # GITHUB_TOKEN — pushes authenticated that way deliberately don't trigger
  # other workflows' `push` listeners (loop prevention), so that commit was
  # silently never deploying on its own. The live site kept serving a
  # stale APK at the same download URL for ~28 hours after a real fix
  # shipped, until an unrelated later human push happened to trigger this
  # workflow again and pick it up along the way. workflow_run doesn't have
  # that restriction (it fires on the *other* workflow completing,
  # regardless of which token pushed the commit it built), so chain off it
  # explicitly instead of relying on a future unrelated push to notice.
  workflow_run:
    workflows: ["Build Flutter Apps (customer / driver / merchant)"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run runs in the context of the DEFAULT branch unless
          # told otherwise — without this, a workflow_run-triggered deploy
          # would silently build and ship main/master instead of the
          # branch that actually just published new APKs.
          #
          # Deliberately head_branch, not head_sha: head_sha is the commit
          # that TRIGGERED build-flutter-apps.yml — i.e. the one *before*
          # its own "Publish APKs to website downloads" step ran and
          # pushed a further commit with the newly built APKs + bumped
          # version.json. By the time this workflow_run fires (after that
          # whole build run, publish step included, has finished), the
          # branch tip already includes that publish commit — checking
          # out head_sha instead deploys the build from one cycle earlier,
          # so the live site's version.json buildNumber (and the in-app
          # update prompt, which compares against it) permanently lagged
          # one release behind every single deploy.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}

      # No local build here anymore (see git history for the old
      # "Pull Vercel environment variables" / "Build" / "Patch serverless
      # function runtime" / "--prebuilt" steps this replaced). That whole
      # approach was built around a bug that's since been fixed upstream
      # and worked around a problem that no longer exists:
      #
      # 1. It existed to pull Production env vars onto this runner because
      #    `npm run build` (plain `astro build`) never talked to Vercel, so
      #    Astro/Vite's build-time static inlining of `import.meta.env.X`
      #    baked in empty values for every server secret. But `vercel pull`
      #    can only ever fetch non-"Sensitive" env var values — a
      #    "Sensitive" var is write-only by design, even to its own owner,
      #    so pulling it always writes a literal "[SENSITIVE]" placeholder
      #    instead of the real value. Every var that mattered here
      #    (SUPABASE_SERVICE_ROLE_KEY, SESSION_JWT_SECRET,
      #    ANTHROPIC_API_KEY, UPSTASH_REDIS_REST_URL/TOKEN) was marked
      #    Sensitive, so this never actually worked.
      # 2. The Node-version patch existed because the @astrojs/vercel
      #    adapter version in use at the time (7.8.2) only recognized Node
      #    18/20 and wrote "nodejs18.x" into each function's .vc-config.json
      #    on any other Node version — which Vercel has since stopped
      #    accepting entirely. The adapter now installed (^11.0.18) detects
      #    the Node major version it's running under and emits the matching
      #    runtime natively (confirmed in its source: 20/22/24 all map to a
      #    real "nodejsNN.x", no fallback needed) — Node 22+ was only ever
      #    needed at build time so `@supabase/realtime-js` has a native
      #    `WebSocket` global (driver-apply.astro's import chain constructs
      #    a Supabase client at module load, at prerender time).
      #
      # Letting Vercel build remotely (no --prebuilt) sidesteps both: its
      # own build infrastructure already runs the project's configured
      # Node version (currently 24.x — Settings → Node.js Version — newer
      # than 22, so WebSocket and the adapter's runtime detection both just
      # work), and it has direct, un-proxied access to every env var
      # regardless of Sensitive/Config type, because the value is never
      # read back by anything outside Vercel's own infrastructure.
      - name: Deploy to Vercel
        run: npx vercel --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
