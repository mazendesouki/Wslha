name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
      - claude/dreamy-johnson-nuzHs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro's SSG build executes page frontmatter server-side, and
          # driver-apply.astro's import chain (src/data/airports.ts →
          # src/utils/supabaseClient.ts) creates a full Supabase client
          # (with Realtime) at module load time. @supabase/realtime-js
          # needs a native `WebSocket` global to construct its client —
          # Node 20 doesn't have one and throws synchronously, crashing
          # `astro build` outright (every deploy on Node 20 has been
          # failing at this exact spot). Node 22+ has WebSocket built in.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Patch serverless function runtime (nodejs18.x -> nodejs20.x)
        # The installed @astrojs/vercel adapter (7.8.2) only recognizes
        # Node 18/20 and falls back to "nodejs18.x" whenever the build runs
        # on anything else (here: Node 22, required — see the comment
        # above — so WebSocket exists for @supabase/realtime-js at build
        # time). Vercel has since made "nodejs18.x" an outright invalid
        # runtime value ("The following Serverless Functions contain an
        # invalid runtime"), which failed every deploy outright. Patches
        # the adapter's own generated .vc-config.json to the newest
        # runtime value it's actually capable of emitting (nodejs20.x,
        # still Vercel-accepted) instead of upgrading Astro/the adapter
        # across a major version just to fix a version-detection warning.
        run: |
          set -e
          for f in .vercel/output/functions/*/.vc-config.json; do
            [ -f "$f" ] || continue
            sed -i 's/"runtime": *"nodejs18\.x"/"runtime": "nodejs20.x"/' "$f"
            echo "Patched $f:"
            cat "$f"
          done

      - name: Deploy to Vercel
        # --prebuilt: without it, the CLI ignores our already-built
        # .vercel/output entirely and re-runs a full build on Vercel's own
        # remote infrastructure instead — which is what was actually
        # silently happening here (visible in the deploy logs: "Running
        # build in Washington, D.C." / "Running 'vercel build'" right
        # before every failure). That remote rebuild re-generates its own
        # nodejs18.x runtime from scratch, so the local patch step above
        # never had any effect — it was patching a file Vercel never
        # looked at. --prebuilt makes it deploy exactly what we already
        # built (and just patched) instead.
        run: npx vercel --prod --prebuilt --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
