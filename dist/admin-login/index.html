<!DOCTYPE html>
<html lang="ar" dir="rtl" class="astro-OM443AEH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول المشرف — وصّلها</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  
<link rel="stylesheet" href="/_astro/admin-login.ea7482fd.css" /></head>
<body class="astro-OM443AEH">
  <div class="card astro-OM443AEH">
    <div class="logo astro-OM443AEH">
      <div class="logo-name astro-OM443AEH">وصّلها</div>
      <div class="logo-sub astro-OM443AEH">لوحة التحكم الإدارية</div>
    </div>
    <div class="shield astro-OM443AEH">🛡️</div>
    <h1 class="astro-OM443AEH">دخول المشرفين</h1>
    <p class="subtitle astro-OM443AEH">هذه المنطقة مخصصة للمشرفين المخوّلين فقط</p>
    <div class="error astro-OM443AEH" id="err"></div>
    <form id="admin-login-form" novalidate class="astro-OM443AEH">
      <div class="field astro-OM443AEH">
        <label for="phone" class="astro-OM443AEH">رقم الجوال</label>
        <input id="phone" type="tel" placeholder="01XXXXXXXXX" dir="ltr" autocomplete="username" required class="astro-OM443AEH">
      </div>
      <div class="field astro-OM443AEH">
        <label for="password" class="astro-OM443AEH">كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required class="astro-OM443AEH">
      </div>
      <button class="btn astro-OM443AEH" type="submit" id="submit-btn">دخول إلى لوحة التحكم</button>
    </form>
    <a class="back astro-OM443AEH" href="/">← العودة للموقع</a>
  </div>

  <script>
    const SB_URL = 'https://vtikgyiopkjnrwlqnmfx.supabase.co';
    const SB_KEY = 'sb_publishable_PLSnpvCT-sAyUMtymNgTwA_QmL2suw4';
    const SB_H   = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` };

    function toIntl(p) {
      if (!p) return '';
      p = p.trim().replace(/\s+/g,'');
      if (p.startsWith('00')) return '+' + p.slice(2);
      if (p.startsWith('01') && p.length === 11) return '+20' + p.slice(1);
      if (p.startsWith('1') && p.length === 10) return '+20' + p;
      return p;
    }
    function toLocal(p) {
      if (!p) return '';
      p = p.trim().replace(/\s+/g,'');
      if (p.startsWith('+20')) return '0' + p.slice(3);
      if (p.startsWith('0020')) return '0' + p.slice(4);
      return p;
    }

    document.getElementById('admin-login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('submit-btn');
      err.style.display = 'none';

      const raw      = document.getElementById('phone').value;
      const intl     = toIntl(raw);
      const local    = toLocal(intl);
      const password = document.getElementById('password').value;

      if (!raw || !password) {
        err.textContent = 'يرجى إدخال الجوال وكلمة المرور';
        err.style.display = 'block'; return;
      }

      btn.disabled = true; btn.textContent = 'جاري التحقق…';

      try {
        const orFilter = `or=(phone.eq.${encodeURIComponent(intl)},phone.eq.${encodeURIComponent(local)})`;
        const res  = await fetch(
          `${SB_URL}/rest/v1/accounts?${orFilter}&select=*&limit=1`,
          { headers: SB_H }
        );
        const rows = res.ok ? await res.json() : [];
        const acc  = rows[0];

        if (!acc) { throw new Error('رقم الجوال غير مسجل'); }
        if (acc.password !== password) { throw new Error('كلمة المرور غير صحيحة'); }
        if (acc.role !== 'admin') { throw new Error('ليس لديك صلاحية الوصول لهذه المنطقة'); }

        localStorage.setItem('wslha_admin', JSON.stringify({
          phone: acc.phone, name: acc.name, role: 'admin', loginAt: new Date().toISOString()
        }));
        localStorage.setItem('wslha_user', JSON.stringify({
          phone: acc.phone, name: acc.name, role: 'admin', loginAt: new Date().toISOString()
        }));
        window.location.href = '/admin';
      } catch(ex) {
        err.textContent = ex.message || 'حدث خطأ، حاول مجدداً';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'دخول إلى لوحة التحكم';
      }
    });

    // Redirect if already logged in as admin
    try {
      const a = JSON.parse(localStorage.getItem('wslha_admin') || 'null');
      if (a?.role === 'admin') window.location.href = '/admin';
    } catch {}
  </script>
</body>
</html>
